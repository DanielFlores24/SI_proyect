<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente INRO · CUCEI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Asistente de Ingeniería Robótica</h1>
    <p>CUCEI · Universidad de Guadalajara</p>
    <a class="salir" href="/logout">Salir</a>
  </header>

  <main id="chat" aria-live="polite">
    <div class="mensaje bot">
      Hola Compañero, buenas tardes, como te puedo apoyar el dia de hoy?
    </div>
  </main>

  <form id="formulario">
    <input id="pregunta" type="text" autocomplete="off"
           placeholder="Ej. ¿Cuántos créditos tiene Control II?" required>
    <button type="submit">Enviar</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
